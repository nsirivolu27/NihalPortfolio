kind = "web"
previewPath = "/"
title = "Personal Portfolio"
description = "A polished personal portfolio website for presenting professional experience, selected work, skills, and contact details in a memorable, recruiter-friendly format."
version = "1.0.0"
id = "artifacts/portfolio-site"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24826

[services.development]
run = "pnpm --filter @workspace/portfolio-site run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/portfolio-site", "run", "build" ]
serve = "static"
publicDir = "artifacts/portfolio-site/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24826"
BASE_PATH = "/"
